---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yunikorn-queue-operator
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yunikorn-queue-operator
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
rules:
  # The operator reconciles every Queue CR in the cluster and materialises
  # them as a single yunikorn-configs ConfigMap.
  - apiGroups:
      - yunikorn.apache.org
    resources:
      - queues
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - yunikorn.apache.org
    resources:
      - queues/status
    verbs: ["get", "patch", "update"]
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    resourceNames:
      - yunikorn-queue-operator
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yunikorn-queue-operator
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yunikorn-queue-operator
subjects:
  - kind: ServiceAccount
    name: yunikorn-queue-operator
    namespace: yunikorn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yunikorn-queue-operator
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["list", "watch", "create"]
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - yunikorn-configs
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - yunikorn-queue-operator-webhook-ca
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    resourceNames:
      - 04cd498c.queue.yunikorn.k8s.io
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yunikorn-queue-operator
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: yunikorn-queue-operator
subjects:
  - kind: ServiceAccount
    name: yunikorn-queue-operator
    namespace: yunikorn
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: 04cd498c.queue.yunikorn.k8s.io
  labels:
    app: yunikorn
    component: yunikorn-queue-operator
